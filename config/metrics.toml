# The metrics dictionary: every fundamental metric the project has used so far, defined
# once, so that a chosen set can become each stock's vector (issue #8, "Quantification").
#
# Read by src/stock_analysis/metrics.py, which lists the metrics, picks a set and builds the
# vector for any stock. reports/14-metrics-dictionary.md is the readable version, built from
# this file with `uv run python -m stock_analysis.metrics doc`.
#
# Each [[metric]]:
#   id          name used in the vector
#   name        readable name
#   group       one of [groups] below
#   unit        $bn (billions of US dollars), $ (per share), x (a multiple), fraction
#               (0.12 = 12%), pp (percentage points a year, as a fraction), score, count,
#               bool, category
#   better      higher, lower, or none (no direction: size, a category, or "it depends")
#   period      ttm (last 12 months), fq (latest quarter's balance sheet), fy (fiscal
#               years), now (today's price), history (several years)
#   definition  what it measures, in words
#   formula     how it is calculated from other metrics or statement lines
#   sources     where it lives: `sector` = column made by analysis/sector.py
#               (data/sector/*.csv, data/peers/*.csv, Yahoo); `stage1` = column in
#               data/screener/stage1.csv (analysis/stage1.py, TradingView, PR #7);
#               `watchlist` = key from analysis/watchlist.py key_numbers(); `stage2` =
#               column in data/screener/top.csv; `growth` = column in
#               data/screener/growth.csv (analysis/growth_screen.py); `tradingview`, `yahoo` and `sec` name the
#               raw field, statement line or XBRL tag. A source can be {column, scale} when
#               the column's unit differs (TradingView gives percentages as 15.5, not 0.155).
#   used_in     where the project uses it
#   example     a worked example on a real stock, with the data date and the working
#   vector      draft status for the vector, for Babak to confirm:
#               core       = proposed for the first vector
#               candidate  = worth considering
#               context    = needed to read the others (size, price), not a feature itself
#               derived    = depends on a peer group or a model, not the stock alone
#   notes       caveats and open choices
#   clip        optional {lower, upper}: bounds applied when the vector is built, before
#               standardizing (report 14, open choice 6: net debt ratios at 0, so every
#               net-cash company counts the same; cover ratios at 50x, so "no debt" (an
#               infinite ratio) counts as the best value rather than a blank)

[meta]
example_stock = "BSX"
example_note = """Worked examples are Boston Scientific (BSX) unless they say otherwise. \
Yahoo figures (sector.py, peer screen) are as of the 2026-10-26 close; TradingView figures \
(Stage 1) as of 2026-10-27; adjusted EPS and P/E history from the 2026-10-27 20:55 watch-list \
run. Booking (BKNG) is used where BSX can't show a case (net cash, negative equity)."""

[groups]
size_price = "Size and price"
balance_sheet = "Balance sheet (absolute)"
income = "Income statement (absolute)"
cash_flow = "Cash flow (absolute)"
debt = "Debt and liquidity ratios"
profitability = "Profitability"
growth = "Growth"
earnings_history = "Earnings history (Lynch inputs)"
quality = "Quality scores"
valuation = "Valuation (needs the price)"

# --- Size and price -------------------------------------------------------------------

[[metric]]
id = "price"
name = "Share price"
group = "size_price"
unit = "$"
better = "none"
period = "now"
definition = "Last closing price."
formula = "close"
sources = { sector = "price", stage1 = "close", watchlist = "price", yahoo = "regularMarketPrice", tradingview = "close" }
used_in = ["absolute values", "watch list", "screener"]
example = { symbol = "BSX", value = 45.58, as_of = "2026-10-26", working = "Yahoo close" }
vector = "context"

[[metric]]
id = "market_cap"
name = "Market value"
group = "size_price"
unit = "$bn"
better = "none"
period = "now"
definition = "What the stock market values all the shares at."
formula = "price x shares outstanding"
sources = { sector = "market_cap", stage1 = "cap_usd_bn", tradingview = "market_cap_basic", yahoo = "marketCap" }
used_in = ["absolute values", "strict screen (>= $1bn)", "screener (>= $1bn)"]
example = { symbol = "BSX", value = 66.06, as_of = "2026-10-26", working = "$45.58 x 1.449bn shares" }
vector = "context"
notes = "Foreign filers are converted to US dollars at today's exchange rate (ECB in the screener)."

[[metric]]
id = "enterprise_value"
name = "Enterprise value"
group = "size_price"
unit = "$bn"
better = "none"
period = "now"
definition = "Price of the whole business: the shares plus the debt, less the cash."
formula = "market_cap + net_debt"
sources = { tradingview = "enterprise_value_fq" }
used_in = ["EV / EBITDA", "DCF (equity = enterprise value - net debt)"]
example = { symbol = "BSX", value = 78.14, as_of = "2026-10-26", working = "66.06 + 12.085" }
vector = "context"

# --- Balance sheet --------------------------------------------------------------------

[[metric]]
id = "total_debt"
name = "Total debt"
group = "balance_sheet"
unit = "$bn"
better = "lower"
period = "fq"
definition = "All borrowings, short and long term, including leases."
formula = "short_term_debt + long_term_debt"
sources = { sector = "total_debt", stage1 = "total_debt_usd_bn", tradingview = "total_debt_fq", yahoo = "Total Debt", sec = "LongTermDebt + DebtCurrent (+ ShortTermBorrowings)" }
used_in = ["absolute values", "debt / equity", "WACC"]
example = { symbol = "BSX", value = 12.624, as_of = "2026-09-30", working = "1.709 short-term + 10.915 long-term" }
vector = "candidate"
notes = "Includes lease liabilities since 2019 (ASC 842 / IFRS 16), which makes older debt figures look lower. BSX will add about $11bn for Penumbra."

[[metric]]
id = "short_term_debt"
name = "Short-term debt"
group = "balance_sheet"
unit = "$bn"
better = "lower"
period = "fq"
definition = "Debt due within a year, including the current part of long-term debt."
formula = "current debt + current lease liabilities; if blank, total_debt - long_term_debt"
sources = { sector = "short_term_debt", stage1 = "short_term_debt_usd_bn", tradingview = "short_term_debt_fq", yahoo = "Current Debt And Capital Lease Obligation", sec = "DebtCurrent / LongTermDebtCurrent + ShortTermBorrowings" }
used_in = ["absolute values", "cash / short-term debt"]
example = { symbol = "BSX", value = 1.709, as_of = "2026-09-30", working = "balance sheet, current debt" }
vector = "candidate"

[[metric]]
id = "long_term_debt"
name = "Long-term debt"
group = "balance_sheet"
unit = "$bn"
better = "lower"
period = "fq"
definition = "Debt due after more than a year."
formula = "non-current debt + non-current lease liabilities"
sources = { sector = "long_term_debt", stage1 = "long_term_debt_usd_bn", tradingview = "long_term_debt_fq", yahoo = "Long Term Debt And Capital Lease Obligation", sec = "LongTermDebtNoncurrent" }
used_in = ["absolute values", "cash / long-term debt"]
example = { symbol = "BSX", value = 10.915, as_of = "2026-09-30", working = "balance sheet, long-term debt" }
vector = "candidate"

[[metric]]
id = "cash"
name = "Cash and short-term investments"
group = "balance_sheet"
unit = "$bn"
better = "higher"
period = "fq"
definition = "Cash, cash equivalents and short-term investments."
formula = "cash and equivalents + short-term investments"
sources = { sector = "cash", stage1 = "cash_usd_bn", tradingview = "cash_n_short_term_invest_fq", yahoo = "Cash Cash Equivalents And Short Term Investments", sec = "CashAndCashEquivalentsAtCarryingValue" }
used_in = ["absolute values", "every cash-against-debt rule"]
example = { symbol = "BSX", value = 0.539, as_of = "2026-09-30", working = "Yahoo; TradingView has 0.648" }
vector = "candidate"
notes = "Yahoo and TradingView differ by what they count as short-term investments; SEC's tag is cash only."

[[metric]]
id = "net_debt"
name = "Net debt"
group = "balance_sheet"
unit = "$bn"
better = "lower"
period = "fq"
definition = "Debt left after paying off what cash can. Negative = net cash."
formula = "total_debt - cash"
sources = { sector = "net_debt", stage1 = "net_debt_usd_bn", tradingview = "net_debt_fq" }
used_in = ["absolute values", "net debt / EBITDA", "DCF"]
example = { symbol = "BSX", value = 12.085, as_of = "2026-09-30", working = "12.624 - 0.539. BKNG: 20.694 - 17.508 = 3.19" }
vector = "candidate"

[[metric]]
id = "book_equity"
name = "Shareholders' equity (book value)"
group = "balance_sheet"
unit = "$bn"
better = "higher"
period = "fq"
definition = "Assets less liabilities on the balance sheet."
formula = "total assets - total liabilities"
sources = { tradingview = "total_equity_fq", yahoo = "Stockholders Equity", sec = "StockholdersEquity" }
used_in = ["debt / equity", "price / book", "Lynch asset play", "ROE"]
example = { symbol = "BSX", value = 25.17, as_of = "2026-09-30", working = "TradingView. BKNG: -10.78 (buybacks larger than its retained profits)" }
vector = "candidate"
notes = "Negative for heavy buyers of their own shares (BKNG), which makes debt / equity and ROE meaningless; Stage 1 then uses net debt / EBITDA <= 2x instead."

# --- Income statement -----------------------------------------------------------------

[[metric]]
id = "revenue"
name = "Revenue"
group = "income"
unit = "$bn"
better = "higher"
period = "ttm"
definition = "Sales over the last 12 months."
formula = "sum of the last 4 quarters' revenue"
sources = { sector = "revenue", stage1 = "revenue_usd_bn", tradingview = "total_revenue_ttm", yahoo = "Total Revenue", sec = "Revenues / RevenueFromContractWithCustomerExcludingAssessedTax" }
used_in = ["absolute values", "net margin", "price / sales"]
example = { symbol = "BSX", value = 20.996, as_of = "2026-09-30", working = "Q4 2025 to Q3 2026" }
vector = "context"

[[metric]]
id = "ebitda"
name = "EBITDA"
group = "income"
unit = "$bn"
better = "higher"
period = "ttm"
definition = "Earnings before interest, tax, depreciation and amortization: operating cash earnings, before paying lenders or replacing assets."
formula = "operating income + depreciation and amortization"
sources = { sector = "ebitda", stage1 = "ebitda_usd_bn", tradingview = "ebitda_ttm", yahoo = "EBITDA", sec = "OperatingIncomeLoss + DepreciationDepletionAndAmortization" }
used_in = ["absolute values", "net debt / EBITDA", "interest cover", "EV / EBITDA"]
example = { symbol = "BSX", value = 5.637, as_of = "2026-09-30", working = "Yahoo; TradingView 5.991" }
vector = "context"
notes = "Yahoo and TradingView differ by how they treat one-offs (BSX: 5.64 vs 5.99)."

[[metric]]
id = "net_income"
name = "Net income"
group = "income"
unit = "$bn"
better = "higher"
period = "ttm"
definition = "Profit after everything, attributable to shareholders (GAAP)."
formula = "sum of the last 4 quarters' net income"
sources = { sector = "net_income", stage1 = "net_income_usd_bn", tradingview = "net_income_ttm", yahoo = "Net Income", sec = "NetIncomeLoss" }
used_in = ["absolute values", "strict screen (profitable)", "net margin"]
example = { symbol = "BSX", value = 3.675, as_of = "2026-09-30", working = "Q4 2025 to Q3 2026" }
vector = "context"

[[metric]]
id = "interest_expense"
name = "Interest expense"
group = "income"
unit = "$bn"
better = "lower"
period = "ttm"
definition = "What the company pays its lenders in a year."
formula = "sum of the last 4 quarters' interest expense"
sources = { yahoo = "Interest Expense", sec = "InterestExpense" }
used_in = ["interest cover", "DCF (after-tax interest added back)"]
example = { symbol = "BSX", value = 0.363, as_of = "2026-09-30", working = "EBITDA 5.637 / interest cover 15.53" }
vector = "candidate"

[[metric]]
id = "d_and_a"
name = "Depreciation and amortization"
group = "income"
unit = "$bn"
better = "none"
period = "ttm"
definition = "The yearly cost of wearing out assets and writing off acquired intangibles."
formula = "from the cash-flow statement"
sources = { yahoo = "Depreciation And Amortization", sec = "DepreciationDepletionAndAmortization" }
used_in = ["standard DCF (stands in for maintenance capex)"]
example = { symbol = "BSX", value = 1.413, as_of = "2026-09-30", working = "4.529 OCF + 0.363 x 0.79 - 3.403 DCF base" }
vector = "context"

[[metric]]
id = "eps_ttm"
name = "EPS, GAAP diluted"
group = "income"
unit = "$"
better = "higher"
period = "ttm"
definition = "Net income per share, after counting options and convertibles."
formula = "net_income / diluted shares"
sources = { sector = "eps_ttm", stage1 = "eps", tradingview = "earnings_per_share_diluted_ttm", yahoo = "trailingEps", sec = "EarningsPerShareDiluted" }
used_in = ["absolute values", "trailing P/E", "screener P/E history", "Lynch categories"]
example = { symbol = "BSX", value = 2.47, as_of = "2026-09-30", working = "3.675bn / about 1.49bn diluted shares" }
vector = "candidate"
notes = "Includes amortization and one-offs, so it understates acquisitive companies like BSX (adjusted EPS $3.21)."

[[metric]]
id = "eps_adj_ttm"
name = "EPS, adjusted"
group = "income"
unit = "$"
better = "higher"
period = "ttm"
definition = "EPS without amortization of acquired intangibles and one-offs, on the same basis as analysts' estimates. Babak's 'true' EPS."
formula = "sum of the last 4 quarters' reported (adjusted) EPS, with eps_override corrections"
sources = { watchlist = "eps_adj_ttm", yahoo = "earnings_dates: Reported EPS" }
used_in = ["watch list: own-history P/E and entry price", "screener Stage 2 (top stocks)"]
example = { symbol = "BSX", value = 3.21, as_of = "2026-09-30", working = "sum of the last 4 reported quarters" }
vector = "core"
notes = "Company-defined, so not identical across companies. One-offs Yahoo still includes are fixed by hand in config/watchlist.toml (NFLX)."

[[metric]]
id = "eps_fwd"
name = "Forward EPS"
group = "income"
unit = "$"
better = "higher"
period = "fy"
definition = "Analysts' average EPS estimate for the next fiscal year."
formula = "consensus estimate"
sources = { sector = "eps_fwd", tradingview = "earnings_per_share_forecast_next_fy", yahoo = "forwardEps" }
used_in = ["absolute values", "forward P/E", "getting-cheaper test"]
example = { symbol = "BSX", value = 3.38, as_of = "2026-10-26", working = "Yahoo consensus, adjusted basis" }
vector = "candidate"
notes = "Not from the statements: an estimate. Keep or drop is an open choice."

# --- Cash flow ------------------------------------------------------------------------

[[metric]]
id = "operating_cf"
name = "Operating cash flow"
group = "cash_flow"
unit = "$bn"
better = "higher"
period = "ttm"
definition = "Cash the business brought in from operations, after tax and interest, before investing."
formula = "net income + non-cash charges +/- working-capital changes"
sources = { sector = "operating_cf", stage1 = "ocf_usd_bn", tradingview = "cash_f_operating_activities_ttm", yahoo = "Operating Cash Flow", sec = "NetCashProvidedByUsedInOperatingActivities" }
used_in = ["absolute values", "turnaround and asset-play rules (positive OCF)", "DCF"]
example = { symbol = "BSX", value = 4.529, as_of = "2026-09-30", working = "Q4 2025 to Q3 2026" }
vector = "context"

[[metric]]
id = "capex"
name = "Capital expenditure"
group = "cash_flow"
unit = "$bn"
better = "none"
period = "ttm"
definition = "Cash spent on property, plant and equipment (negative number = spent)."
formula = "purchases of property, plant and equipment"
sources = { sector = "capex", stage1 = "capex_usd_bn", tradingview = "capital_expenditures_ttm", yahoo = "Capital Expenditure", sec = "PaymentsToAcquirePropertyPlantAndEquipment" }
used_in = ["absolute values", "free cash flow"]
example = { symbol = "BSX", value = -2.723, as_of = "2026-09-30", working = "Yahoo; TradingView -0.904" }
vector = "context"
notes = "Yahoo's capex can include acquisitions and stakes (BSX: -2.72 vs -0.90 on TradingView and SEC). Check SEC."

[[metric]]
id = "free_cf"
name = "Free cash flow"
group = "cash_flow"
unit = "$bn"
better = "higher"
period = "ttm"
definition = "Cash left after keeping the business going and growing it: what can pay debt, dividends and buybacks."
formula = "operating_cf + capex"
sources = { sector = "free_cf", stage1 = "fcf_usd_bn", tradingview = "free_cash_flow_ttm" }
used_in = ["absolute values", "FCF yield"]
example = { symbol = "BSX", value = 1.806, as_of = "2026-09-30", working = "4.529 - 2.723 (Yahoo); 3.625 on TradingView" }
vector = "context"

[[metric]]
id = "fcff_before_growth"
name = "Cash flow before growth (DCF base)"
group = "cash_flow"
unit = "$bn"
better = "higher"
period = "ttm"
definition = "Cash the whole firm earns before growth investment and before paying lenders: the standard DCF's starting cash flow."
formula = "operating_cf - d_and_a + interest_expense x (1 - 21% tax)"
sources = { sector = "fcff_before_growth" }
used_in = ["absolute values", "standard DCF"]
example = { symbol = "BSX", value = 3.403, as_of = "2026-09-30", working = "4.529 - 1.413 + 0.363 x 0.79" }
vector = "candidate"
notes = "Treats depreciation as maintenance capex, so all capex above it counts as growth."

# --- Debt and liquidity ratios --------------------------------------------------------

[[metric]]
id = "cash_to_short_term_debt"
name = "Cash / short-term debt"
group = "debt"
unit = "x"
better = "higher"
period = "fq"
definition = "Can today's cash pay what falls due this year? Babak's first must-have."
formula = "cash / short_term_debt (no short-term debt = passes)"
sources = { sector = "cash_to_short_term_debt", stage1 = "cash_to_short_term_debt" }
used_in = ["strict screen (>= 1)", "weighted debt score", "every Stage 1 rule set (>= 1)"]
example = { symbol = "BSX", value = 0.315, as_of = "2026-09-30", working = "0.539 / 1.709: fails. BKNG: 17.5 / 2.0 = 8.8" }
vector = "core"
clip = { upper = 50.0 }

[[metric]]
id = "cash_plus_ocf_to_short_term_debt"
name = "(Cash + operating cash flow) / short-term debt"
group = "debt"
unit = "x"
better = "higher"
period = "fq"
definition = "Same test, counting a year's operating cash flow as well as cash on hand."
formula = "(cash + max(operating_cf, 0)) / short_term_debt"
sources = { sector = "cash_plus_ocf_to_short_term_debt" }
used_in = ["sector table (shown, not a rule)"]
example = { symbol = "BSX", value = 2.97, as_of = "2026-09-30", working = "(0.539 + 4.529) / 1.709" }
vector = "candidate"
clip = { upper = 50.0 }
notes = "Open choice: a fairer version of the first must-have for companies that keep little cash (BSX passes this, fails the strict one)."

[[metric]]
id = "cash_to_long_term_debt"
name = "Cash / long-term debt"
group = "debt"
unit = "x"
better = "higher"
period = "fq"
definition = "Is there a cash cushion against long-term debt? Babak's second must-have."
formula = "cash / long_term_debt"
sources = { sector = "cash_to_long_term_debt", stage1 = "cash_to_long_term_debt" }
used_in = ["strict screen (>= 5%)", "weighted debt score", "Stage 1 slow grower, stalwart, cyclical (>= 5%)"]
example = { symbol = "BSX", value = 0.049, as_of = "2026-09-30", working = "0.539 / 10.915: just under 5% (TradingView's 0.648 gives 5.9%)" }
vector = "core"
clip = { upper = 50.0 }

[[metric]]
id = "cash_to_total_debt"
name = "Cash / total debt"
group = "debt"
unit = "x"
better = "higher"
period = "fq"
definition = "Share of all debt cash could repay today."
formula = "cash / total_debt"
sources = { stage1 = "cash_to_total_debt" }
used_in = ["Stage 1 turnaround (>= 25%)"]
example = { symbol = "BSX", value = 0.051, as_of = "2026-09-30", working = "0.648 / 12.624 (TradingView)" }
vector = "candidate"
clip = { upper = 50.0 }
notes = "Overlaps cash / short-term and cash / long-term debt."

[[metric]]
id = "net_debt_to_ebitda"
name = "Net debt / EBITDA"
group = "debt"
unit = "x"
better = "lower"
period = "ttm"
definition = "Years of operating earnings needed to repay the net debt. The standard leverage measure."
formula = "net_debt / ebitda (net cash always passes; EBITDA <= 0 fails)"
sources = { sector = "net_debt_to_ebitda", stage1 = "net_debt_to_ebitda" }
used_in = ["strict screen (<= 4.5x)", "weighted debt score", "Stage 1 slow grower, stalwart (<= 4.5x), REITs (<= 7x)", "debt_to_ebitda.py history"]
example = { symbol = "BSX", value = 2.14, as_of = "2026-09-30", working = "12.085 / 5.637. BKNG: 3.19 / 10.65 = 0.30" }
vector = "core"
clip = { lower = 0.0 }
notes = "Negative when net cash; clipped at 0 for the vector (open choice 6, default until Babak decides), so every net-cash company counts the same."

[[metric]]
id = "net_debt_to_avg_ebitda"
name = "Net debt / 10-year average EBITDA"
group = "debt"
unit = "x"
better = "lower"
period = "history"
definition = "Leverage against earnings over a whole cycle rather than today's point in it."
formula = "net_debt / mean(EBITDA, last 10 fiscal years; needs 5)"
sources = { stage1 = "net_debt_to_avg_ebitda" }
used_in = ["Stage 1 cyclical (<= 2.5x)"]
example = { symbol = "BSX", value = 3.97, as_of = "2026-09-30", working = "11.976 / 3.02 average 2016-2025 EBITDA" }
vector = "candidate"
clip = { lower = 0.0 }
notes = "For growing companies it overstates leverage (BSX 3.97x against 2.0x on today's EBITDA)."

[[metric]]
id = "interest_cover"
name = "Interest cover (EBITDA / interest)"
group = "debt"
unit = "x"
better = "higher"
period = "ttm"
definition = "How many times operating earnings cover the interest bill."
formula = "ebitda / interest_expense (net cash always passes)"
sources = { sector = "ebitda_to_interest", stage1 = "interest_cover", tradingview = "ebitda_interst_cover_ttm" }
used_in = ["strict screen (>= 4x)", "weighted debt score", "Stage 1 (>= 4x; REITs >= 2.5x)"]
example = { symbol = "BSX", value = 15.53, as_of = "2026-09-30", working = "5.637 / 0.363 (TradingView 18.3)" }
vector = "core"
clip = { upper = 50.0 }

[[metric]]
id = "debt_to_equity"
name = "Debt / equity"
group = "debt"
unit = "x"
better = "lower"
period = "fq"
definition = "Borrowed money against owners' money. Lynch's balance-sheet test for fast growers."
formula = "total_debt / book_equity"
sources = { sector = "debt_to_equity", stage1 = "debt_to_equity", tradingview = "debt_to_equity_fq" }
used_in = ["Stage 1 fast grower and asset play (<= 1.0)"]
example = { symbol = "BSX", value = 0.51, as_of = "2026-09-30", working = "12.624 / 24.93. BKNG: undefined (negative equity)" }
vector = "candidate"
notes = "Lynch's 'normal' was 0.33 before leases counted as debt; Stage 1 uses 1.0. Meaningless with negative equity."

[[metric]]
id = "net_cash_to_market_cap"
name = "Net cash / market value"
group = "debt"
unit = "fraction"
better = "higher"
period = "fq"
definition = "Part of the price covered by net cash. Lynch's asset-play signal."
formula = "-net_debt / market_cap"
sources = { stage1 = "net_cash_to_cap" }
used_in = ["Lynch category: asset play (> 30%)"]
example = { symbol = "BSX", value = -0.183, as_of = "2026-10-27", working = "-11.976 / 65.41 (net debt, so negative)" }
vector = "candidate"

# --- Profitability --------------------------------------------------------------------

[[metric]]
id = "net_margin"
name = "Net margin"
group = "profitability"
unit = "fraction"
better = "higher"
period = "ttm"
definition = "Profit kept from each dollar of sales."
formula = "net_income / revenue"
sources = { sector = "net_margin", tradingview = { column = "net_margin_ttm", scale = 0.01 } }
used_in = ["weighted quality score (weight 2)"]
example = { symbol = "BSX", value = 0.175, as_of = "2026-09-30", working = "3.675 / 20.996" }
vector = "core"

[[metric]]
id = "net_margin_avg"
name = "Net margin, average of fiscal years"
group = "profitability"
unit = "fraction"
