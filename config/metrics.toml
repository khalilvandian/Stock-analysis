# --- Earnings history (Lynch inputs) --------------------------------------------------

[[metric]]
id = "eps_vs_5y_peak"
name = "EPS against its 5-year peak"
group = "earnings_history"
unit = "fraction"
better = "higher"
period = "history"
definition = "How far today's EPS is below (or above) the best of the last 5 fiscal years. Below -50% = Lynch turnaround."
formula = "max(eps_ttm, eps_FY0) / max(eps, last 5 FY) - 1"
sources = { stage1 = "eps_vs_5y_peak" }
used_in = ["Lynch category: turnaround"]
example = { symbol = "BSX", value = 0.272, as_of = "2026-09-30", working = "2.466 / 1.939 - 1: 27% above the old peak" }
vector = "candidate"

[[metric]]
id = "loss_now"
name = "Losing money now"
group = "earnings_history"
unit = "bool"
better = "lower"
period = "ttm"
definition = "EPS of the last 12 months or of the latest fiscal year is zero or below."
formula = "eps_ttm <= 0 or eps_FY0 <= 0"
sources = { stage1 = "loss_now" }
used_in = ["Lynch category: turnaround"]
example = { symbol = "BSX", value = false, as_of = "2026-09-30", working = "2.47 > 0 and 1.94 > 0" }
vector = "candidate"

[[metric]]
id = "no_profit_5y"
name = "No profit in 5 years"
group = "earnings_history"
unit = "bool"
better = "lower"
period = "history"
definition = "Loss in every one of the last 5 fiscal years. Not a Lynch category: Stage 1 fails these."
formula = "max(eps, last 5 FY) <= 0"
sources = { stage1 = "no_profit_5y" }
used_in = ["Stage 1 (fail)"]
example = { symbol = "BSX", value = false, as_of = "FY2021-FY2025", working = "best year 1.94" }
vector = "candidate"

[[metric]]
id = "eps_big_drops_10y"
name = "Big EPS drops in 10 years"
group = "earnings_history"
unit = "count"
better = "lower"
period = "history"
definition = "Years in the last 10 when EPS fell by more than 30%. 3 or more = cyclical by history (unless a fast grower)."
formula = "count(eps_y / eps_y-1 - 1 < -30%, eps_y-1 > 0)"
sources = { stage1 = "eps_big_drops_10y" }
used_in = ["Lynch category: cyclical"]
example = { symbol = "BSX", value = 3, as_of = "FY2015-FY2025", working = "2017 (-70%), 2020 (a loss after 2019's one-off tax gain), 2022 (-35%)" }
vector = "candidate"
notes = "GAAP one-offs count as drops (BSX's 2019 tax gain), so this flags lumpy accounting as well as real cycles."

[[metric]]
id = "eps_avg_10y"
name = "Average EPS over 10 years"
group = "earnings_history"
unit = "$"
better = "higher"
period = "history"
definition = "Mean diluted EPS over the last 10 fiscal years (needs 5). For a cyclical, profit over the cycle."
formula = "mean(eps, last 10 FY)"
sources = { stage1 = "eps_avg_10y" }
used_in = ["Stage 1 cyclical (> 0)"]
example = { symbol = "BSX", value = 1.016, as_of = "FY2016-FY2025", working = "mean of 1.94, 1.25, 1.07, 0.45, 0.69, -0.08, 3.33, 1.19, 0.07, 0.25" }
vector = "candidate"
notes = "In dollars per share, so it doesn't compare across stocks; use eps_ttm / eps_avg_10y if it goes in the vector."

[[metric]]
id = "recession_eps_change"
name = "EPS change in recessions"
group = "earnings_history"
unit = "fraction"
better = "higher"
period = "history"
definition = "Worst yearly EPS change in the 2009 and 2020 fiscal years. Lynch: stalwarts hold up in recessions."
formula = "min(eps_2009 / eps_2008 - 1, eps_2020 / eps_2019 - 1)"
sources = { stage1 = "recession_eps_change" }
used_in = ["Stage 1 stalwart (no worse than -30%)"]
example = { symbol = "BSX", value = -1.024, as_of = "FY2020", working = "-0.081 / 3.332 - 1 (2019 had a one-off tax gain)" }
vector = "candidate"

[[metric]]
id = "dividend_years_10y"
name = "Years with a dividend, of 10"
group = "earnings_history"
unit = "count"
better = "higher"
period = "history"
definition = "How many of the last 10 fiscal years paid a dividend."
formula = "count(dps > 0, last 10 FY)"
sources = { stage1 = "dividend_years_10y" }
used_in = ["Stage 1 slow grower (10 of 10; none at all passes)"]
example = { symbol = "BSX", value = 0, as_of = "FY2016-FY2025", working = "no dividend. BKNG: 2 (since 2024)" }
vector = "candidate"

[[metric]]
id = "payout_ratio"
name = "Dividend payout ratio"
group = "earnings_history"
unit = "fraction"
better = "lower"
period = "ttm"
definition = "Share of earnings paid out as dividends. Lynch: leaves a cushion in hard times."
formula = "dividends per share / eps_ttm"
sources = { stage1 = { column = "dividend_payout_ratio_ttm", scale = 0.01 }, tradingview = { column = "dividend_payout_ratio_ttm", scale = 0.01 } }
used_in = ["Stage 1 slow grower (<= 80%)"]
example = { symbol = "BKNG", value = 0.178, as_of = "2026-09-30", working = "TradingView (BSX pays none: 0)" }
vector = "candidate"

[[metric]]
id = "lynch_category"
name = "Lynch category"
group = "earnings_history"
unit = "category"
better = "none"
period = "history"
definition = "Peter Lynch's six kinds of stock (One Up on Wall Street, ch. 7): slow grower, stalwart, fast grower, cyclical, turnaround, asset play; plus no_profit."
formula = "tested in order: no_profit_5y; cyclical industry; turnaround (loss_now or eps_vs_5y_peak < -50%); cyclical history (eps_big_drops_10y >= 3, not fast); asset play (price/book < 1 or net cash > 30% of value); then eps_growth_median >= 20% fast, >= 8% stalwart, else slow"
sources = { stage1 = "category" }
used_in = ["Stage 1: picks each company's rule set"]
example = { symbol = "BSX", value = "fast_grower", as_of = "2026-10-27", working = "EPS median growth 36% >= 20%; 3 big drops but fast growers are exempt" }
vector = "core"
notes = "A label, not a number: in the vector it would be one-hot (six 0/1 columns) or used to compare stocks only within a category (open choice)."

# --- Quality scores -------------------------------------------------------------------

[[metric]]
id = "piotroski_f"
name = "Piotroski F-score"
group = "quality"
unit = "score"
better = "higher"
period = "fy"
definition = "Nine pass/fail tests of financial strength, one point each (Piotroski 2000). Profit: net income > 0, OCF > 0, ROA up, OCF > net income. Balance sheet: long-term debt ratio down, current ratio up, no new shares. Efficiency: gross margin up, asset turnover up."
formula = "sum of 9 binary tests, latest fiscal year against the one before"
sources = { stage1 = "piotroski_f_score_ttm", tradingview = "piotroski_f_score_ttm" }
used_in = ["Stage 1 (>= 5, all non-financial categories but cyclical, turnaround, asset play)"]
example = { symbol = "BSX", value = 8, as_of = "2026-10-27", working = "TradingView; BKNG 7" }
vector = "core"
notes = "Computed by TradingView; we don't recompute the nine parts. Recomputing from SEC filings is possible (open choice)."

[[metric]]
id = "altman_z"
name = "Altman Z-score"
group = "quality"
unit = "score"
better = "higher"
period = "fq"
definition = "Bankruptcy-risk score (Altman 1968). Below 1.81 = distress zone, 1.81-2.99 grey, above 2.99 safe."
formula = "1.2 x working capital/assets + 1.4 x retained earnings/assets + 3.3 x EBIT/assets + 0.6 x market value/liabilities + 1.0 x sales/assets"
sources = { stage1 = "altman_z_score_ttm", tradingview = "altman_z_score_ttm" }
used_in = ["Stage 1 (>= 1.8, not utilities, banks, insurers or REITs)"]
example = { symbol = "BSX", value = 2.93, as_of = "2026-10-27", working = "TradingView: grey zone, just under safe. BKNG 6.17" }
vector = "core"
notes = "Built for manufacturers; it penalizes asset-heavy and lease-heavy businesses."

[[metric]]
id = "debt_score"
name = "Weighted screen: debt score"
group = "quality"
unit = "score"
better = "higher"
period = "fq"
definition = "Percentile (0-100) within the peer group, averaged over cash / short-term debt, cash / long-term debt, net debt / EBITDA and interest cover."
formula = "mean(percentile ranks of the 4 debt ratios)"
sources = { sector = "debt_score" }
used_in = ["weighted screen (50% of the total)"]
example = { symbol = "BSX", value = 29.5, as_of = "2026-10-27", working = "against 9 medical-device peers (report 11)" }
vector = "derived"
notes = "Relative to whichever peers it is run on, so not a property of the stock. Built from the ratios above; the vector can take the ratios instead."

[[metric]]
id = "quality_score"
name = "Weighted screen: profitability and cash score"
group = "quality"
unit = "score"
better = "higher"
period = "history"
definition = "Weighted percentile of net margin (2), margin change avg and median (1 each), OCF growth avg and median (1 each), cash growth avg and median (0.5 each)."
formula = "weighted mean of percentile ranks"
sources = { sector = "quality_score" }
used_in = ["weighted screen (25%)"]
example = { symbol = "BSX", value = 77.0, as_of = "2026-10-27", working = "against 9 medical-device peers (report 11)" }
vector = "derived"

[[metric]]
id = "cheap_score"
name = "Weighted screen: cheapness score"
group = "quality"
unit = "score"
better = "higher"
period = "now"
definition = "Percentile of price vs DCF, P/E vs industry median, EV/EBITDA vs industry median and expected P/E change (lower = cheaper = higher score)."
formula = "mean(percentile ranks, reversed)"
sources = { sector = "cheap_score" }
used_in = ["weighted screen (25%)"]
example = { symbol = "BSX", value = 80.6, as_of = "2026-10-27", working = "against 9 medical-device peers (report 11)" }
vector = "derived"

[[metric]]
id = "total_score"
name = "Weighted screen: total"
group = "quality"
unit = "score"
better = "higher"
period = "now"
definition = "Babak's weighted score: debt 50%, profitability and cash 25%, cheapness 25%."
formula = "0.5 x debt_score + 0.25 x quality_score + 0.25 x cheap_score"
sources = { sector = "total_score" }
used_in = ["weighted screen ranking"]
example = { symbol = "BSX", value = 54.1, as_of = "2026-10-27", working = "0.5 x 29.5 + 0.25 x 77.0 + 0.25 x 80.6; 5th of 9 (report 11)" }
vector = "derived"

# --- Valuation ------------------------------------------------------------------------

[[metric]]
id = "pe_ttm"
name = "P/E, trailing GAAP"
group = "valuation"
unit = "x"
better = "lower"
period = "now"
definition = "Price against the last 12 months' GAAP EPS."
formula = "price / eps_ttm"
sources = { sector = "pe_ttm", tradingview = "price_earnings_ttm", yahoo = "trailingPE" }
used_in = ["peer screen", "cheap score (vs industry median)"]
example = { symbol = "BSX", value = 18.45, as_of = "2026-10-26", working = "45.58 / 2.47" }
vector = "candidate"

[[metric]]
id = "pe_adj"
name = "P/E, trailing adjusted"
group = "valuation"
unit = "x"
better = "lower"
period = "now"
definition = "Price against adjusted EPS: Babak's 'true' P/E."
formula = "price / eps_adj_ttm"
sources = { watchlist = "pe_adj" }
used_in = ["watch list", "entry price"]
example = { symbol = "BSX", value = 14.02, as_of = "2026-10-27", working = "45.02 / 3.21" }
vector = "core"

[[metric]]
id = "pe_fwd"
name = "P/E, forward"
group = "valuation"
unit = "x"
better = "lower"
period = "now"
definition = "Price against next year's consensus EPS."
formula = "price / eps_fwd"
sources = { sector = "pe_fwd", yahoo = "forwardPE" }
used_in = ["getting-cheaper test"]
example = { symbol = "BSX", value = 13.50, as_of = "2026-10-26", working = "45.58 / 3.38" }
vector = "candidate"

[[metric]]
id = "pe_change_expected"
name = "Expected P/E change"
group = "valuation"
unit = "fraction"
better = "lower"
period = "now"
definition = "How much the P/E falls at today's price if next year's estimate is met."
formula = "pe_fwd / pe_ttm - 1"
sources = { sector = "pe_change_expected" }
used_in = ["cheap score", "getting-cheaper test (<= -15%)"]
example = { symbol = "BSX", value = -0.268, as_of = "2026-10-26", working = "13.50 / 18.45 - 1" }
vector = "candidate"
notes = "Mixes adjusted (forward) and GAAP (trailing) EPS, so it overstates the drop for acquisitive companies."

[[metric]]
id = "pe_median_10y"
name = "Own P/E, 10-year median"
group = "valuation"
unit = "x"
better = "none"
period = "history"
definition = "Median of the stock's yearly P/E (average price / adjusted EPS) over 10 calendar years."
formula = "median(avg price_y / adjusted eps_y, last 10 years)"
sources = { watchlist = "pe_median_10y", stage2 = "pe_median_10y" }
used_in = ["watch list", "Stage 2"]
example = { symbol = "BSX", value = 25.17, as_of = "2016-2025", working = "watch list, adjusted EPS" }
vector = "context"

[[metric]]
id = "pe_vs_own_median"
name = "P/E against own 10-year median"
group = "valuation"
unit = "fraction"
better = "lower"
period = "now"
definition = "How cheap the stock is against its own history."
formula = "pe_adj / pe_median_10y - 1"
sources = {}
used_in = ["watch list (shown)", "panic-sell screen"]
example = { symbol = "BSX", value = -0.443, as_of = "2026-10-27", working = "14.02 / 25.17 - 1" }
vector = "core"

[[metric]]
id = "pe_rel"
name = "P/E against industry median"
group = "valuation"
unit = "fraction"
better = "lower"
period = "now"
definition = "Trailing P/E against the median of its industry in the peer group."
formula = "pe_ttm / median(pe_ttm, same industry) - 1"
sources = { sector = "pe_rel", stage2 = "pe_vs_sector" }
used_in = ["strict and weighted screens (cheapness)"]
example = { symbol = "BSX", value = -0.342, as_of = "2026-10-26", working = "18.45 / 28.04 Medical Devices median - 1" }
vector = "derived"

[[metric]]
id = "ev_to_ebitda"
name = "EV / EBITDA"
group = "valuation"
unit = "x"
better = "lower"
period = "now"
definition = "Price of the whole business against its operating earnings; unaffected by how it is financed."
formula = "enterprise_value / ebitda"
sources = { sector = "ev_to_ebitda", tradingview = "enterprise_value_ebitda_ttm" }
used_in = ["peer screen", "cheap score"]
example = { symbol = "BSX", value = 13.86, as_of = "2026-10-26", working = "78.14 / 5.637" }
vector = "candidate"

[[metric]]
id = "ev_rel"
name = "EV / EBITDA against industry median"
group = "valuation"
unit = "fraction"
better = "lower"
period = "now"
definition = "EV / EBITDA against its industry's median."
formula = "ev_to_ebitda / median(ev_to_ebitda, same industry) - 1"
sources = { sector = "ev_rel", stage2 = "ev_ebitda_vs_sector" }
used_in = ["strict and weighted screens (cheapness)"]
example = { symbol = "BSX", value = -0.109, as_of = "2026-10-26", working = "13.86 / 15.56 Medical Devices median - 1" }
vector = "derived"

[[metric]]
id = "price_to_sales"
name = "Price / sales"
group = "valuation"
unit = "x"
better = "lower"
period = "now"
definition = "Market value against revenue."
formula = "market_cap / revenue"
sources = { sector = "price_to_sales" }
used_in = ["sector table"]
example = { symbol = "BSX", value = 3.15, as_of = "2026-10-26", working = "66.06 / 20.996" }
vector = "candidate"

[[metric]]
id = "price_to_book"
name = "Price / book"
group = "valuation"
unit = "x"
better = "lower"
period = "now"
definition = "Market value against book equity."
formula = "market_cap / book_equity"
sources = { sector = "price_to_book", tradingview = "price_book_fq", yahoo = "priceToBook" }
used_in = ["Lynch category: asset play (< 1)"]
example = { symbol = "BSX", value = 2.65, as_of = "2026-10-26", working = "66.06 / 24.93" }
vector = "candidate"

[[metric]]
id = "fcf_yield"
name = "Free cash flow yield"
group = "valuation"
unit = "fraction"
better = "higher"
period = "now"
definition = "Free cash flow as a share of the market value: the cash return at today's price."
formula = "free_cf / market_cap"
sources = { sector = "fcf_yield", stage2 = "fcf_yield" }
used_in = ["sector table", "Stage 2 (shown)"]
example = { symbol = "BSX", value = 0.027, as_of = "2026-10-26", working = "1.806 / 66.06 (5.5% with TradingView's capex)" }
vector = "core"

[[metric]]
id = "dividend_yield"
name = "Dividend yield"
group = "valuation"
unit = "fraction"
better = "none"
period = "now"
definition = "Dividends over the last year against the price."
formula = "dividends per share / price"
sources = { sector = "dividend_yield", tradingview = { column = "dividends_yield", scale = 0.01 } }
used_in = ["sector table"]
example = { symbol = "BSX", value = 0.0, as_of = "2026-10-26", working = "no dividend" }
vector = "candidate"

[[metric]]
id = "wacc"
name = "Weighted cost of capital (WACC)"
group = "valuation"
unit = "fraction"
better = "none"
period = "now"
definition = "Return investors require on the whole firm: the DCF discount rate."
formula = "E/(D+E) x (5.18% + (0.67 x beta + 0.33) x 5%) + D/(D+E) x (5.18% + spread) x (1 - 21%); spread 1.3% / 2% / 3% for net debt / EBITDA < 3 / < 5 / higher"
sources = { sector = "wacc" }
used_in = ["standard DCF"]
example = { symbol = "BSX", value = 0.0817, as_of = "2026-10-26", working = "beta 0.575; equity 66.06, debt 12.62" }
vector = "derived"

[[metric]]
id = "dcf_fair_value"
name = "DCF fair value"
group = "valuation"
unit = "$"
better = "none"
period = "now"
definition = "Value per share if the DCF base cash flow grows at inflation (2.5%) for ever: what the stock is worth with no growth premium."
formula = "(fcff_before_growth x 1.025 / (wacc - 2.5%) - net_debt) / shares"
sources = { sector = "dcf_fair_value" }
used_in = ["absolute values", "cheap score"]
example = { symbol = "BSX", value = 34.09, as_of = "2026-10-26", working = "(3.403 x 1.025 / (8.17% - 2.5%) - 12.085) / 1.449" }
vector = "derived"

[[metric]]
id = "price_vs_fair_value"
name = "Price against DCF fair value"
group = "valuation"
unit = "fraction"
better = "lower"
period = "now"
definition = "Premium (positive) or discount to the no-growth DCF value: the growth the price assumes."
formula = "price / dcf_fair_value - 1"
sources = { sector = "price_vs_fair_value" }
used_in = ["strict and weighted screens (cheapness)"]
example = { symbol = "BSX", value = 0.337, as_of = "2026-10-26", working = "45.58 / 34.09 - 1" }
vector = "derived"

[[metric]]
id = "entry_price"
name = "Entry price at target P/E"
group = "valuation"
unit = "$"
better = "none"
period = "now"
definition = "The price at which the stock reaches Babak's target multiple."
formula = "target_pe x eps_adj_ttm"
sources = { watchlist = "entry_price" }
used_in = ["watch list"]
example = { symbol = "BSX", value = 41.73, as_of = "2026-10-27", working = "13 x 3.21" }
vector = "derived"
notes = "Depends on a chosen target, so it belongs to the decision, not the vector."

[[metric]]
id = "price_vs_cheap"
name = "Price against own cheap price"
group = "valuation"
unit = "fraction"
better = "lower"
period = "now"
definition = "Stage 2's ranking measure: price against the stock's own bottom-quarter P/E times today's EPS."
formula = "price / (min(25th percentile of own 10-year P/E, sector median P/E) x eps) - 1"
sources = { stage2 = "vs_cheap" }
used_in = ["Stage 2 ranking"]
example = { symbol = "IPS", value = -0.082, as_of = "2026-10-27", working = "Ipsos: 35.46 / (9.67 x 3.99) - 1. BSX failed Stage 1, so has no Stage 2 row" }
vector = "core"

# --- Named sets -----------------------------------------------------------------------
# A set is a list of metric ids. "proposed" is Claude's draft for the first vector, for
# Babak to cut or extend; the others are the inputs of each existing screen.

[sets]
proposed = [
  "cash_to_short_term_debt", "cash_to_long_term_debt", "net_debt_to_ebitda", "interest_cover",
  "net_margin", "revenue_growth_median", "eps_growth_median", "ocf_growth_median",
  "piotroski_f", "altman_z", "lynch_category",
  "eps_adj_ttm", "pe_adj", "pe_vs_own_median", "fcf_yield", "price_vs_cheap",
]
absolute_values = [
  "price", "market_cap", "dcf_fair_value", "fcff_before_growth", "total_debt", "net_debt",
  "short_term_debt", "long_term_debt", "cash", "revenue", "ebitda", "net_income", "eps_ttm",
  "eps_fwd", "operating_cf", "capex", "free_cf",
]
strict_screen = [
  "market_cap", "net_income", "ebitda", "cash_to_short_term_debt", "cash_to_long_term_debt",
  "net_debt_to_ebitda", "interest_cover",
]
weighted_screen = [
  "cash_to_short_term_debt", "cash_to_long_term_debt", "net_debt_to_ebitda", "interest_cover",
  "net_margin", "margin_change_avg", "margin_change_median", "ocf_growth_avg",
  "ocf_growth_median", "cash_growth_avg", "cash_growth_median", "price_vs_fair_value",
  "pe_rel", "ev_rel", "pe_change_expected", "revenue_growth_avg", "revenue_growth_median",
  "eps_growth_avg", "eps_growth_median",
]
stage1 = [
  "cash_to_short_term_debt", "cash_to_long_term_debt", "cash_to_total_debt",
  "net_debt_to_ebitda", "net_debt_to_avg_ebitda", "interest_cover", "debt_to_equity",
  "net_cash_to_market_cap", "roe", "revenue_growth_median", "eps_growth_median",
  "eps_cagr_3y", "eps_vs_5y_peak", "loss_now", "no_profit_5y", "eps_big_drops_10y",
  "eps_avg_10y", "recession_eps_change", "dividend_years_10y", "payout_ratio",
  "price_to_book", "piotroski_f", "altman_z", "lynch_category",
]
watchlist = ["price", "eps_adj_ttm", "pe_adj", "pe_median_10y", "pe_vs_own_median", "entry_price"]

# Considered and left out of the dictionary: not from the financial statements.
[excluded]
technicals = "RSI, 50- and 200-day averages, 52-week range, one-year performance (Stage 2 timing only)"
analyst = "Analyst target upside and rating (sector.py analyst_upside, analyst_view; TradingView Recommend.All)"
market = "Beta (used inside WACC), indices, sector breadth (market report)"
