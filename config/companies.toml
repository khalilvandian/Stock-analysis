[[share_class]]
symbol = "BRK.B"
member = "us-gaap:EquivalentClassBMember"
tags = { eps_diluted = ["us-gaap:EarningsPerShareBasic"] }
not_from_yahoo = ["shares_outstanding"]
note = """Berkshire reports net earnings per average equivalent Class A and Class B share, basic
only: it has no dilutive securities, so basic is its diluted figure (10-K 2024: $41.27 per
Class B share, $61,900 per Class A share). BRK.B is listed. Shares outstanding are stated in
equivalent Class A shares (1,438,223 at the end of 2024 = 547,562 A + 1,335,992,139 B / 1,500);
a Class A share converts into 1,500 Class B shares by the charter, so BRK.B's count is 1,500
times that. Yahoo's count is the Class A one, so it isn't used."""

[[share_class.convert]]
item = "shares_outstanding"
concept = "us-gaap:CommonStockSharesOutstanding"
member = "brka:EquivalentClassAMember"
factor = 1500

[[custom_tag]]
symbol = "BF.B"
item = "revenue"
tags = ["NetSalesExcludingExciseTaxes"]
note = """Net sales after excise taxes, as every later year: fiscal 2016 ($3,089m) is reported
so in the 10-Ks for 2017 and 2018. The 2016 10-K's "Net sales" (SalesRevenueGoodsNet, $4,011m)
includes the $922m of excise taxes, so it is not used."""

[[custom_tag]]
symbol = "D"
item = "capex"
tags = ["PaymentsToAcquirePropertyPlantAndEquipmentIncludingNuclearFuel"]
note = "Plant construction and other property additions (including nuclear fuel): $12.2bn in 2024"

[[custom_tag]]
symbol = "DTE"
item = "capex"
tags = ["PlantAndEquipmentExpendituresUtility", "PlantAndEquipmentExpendituresNonUtility"]
note = "Plant and equipment expenditures, utility and non-utility: $4.40bn + $0.07bn in 2024"
