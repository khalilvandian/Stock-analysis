# Facts about single companies that the sources don't give (issue #29, docs/COVERAGE.md).
#
# [[predecessor]]: the company's earlier filings are under another SEC CIK, because a new
# holding company took over the listed one (a reorganisation, a redomicile or a merger where
# the listed company is the accounting predecessor). The ingest fetches the old CIK's company
# facts too, and the build reads them for periods that end before `until`, the date of the new
# CIK's first 10-K or 10-Q. Each one was checked: the old company's fiscal-year revenue and net
# income equal the comparative years in the new company's filings (2026-11-17).
#
# [[share_class]]: the company reports some values only per share class (XBRL axis
# us-gaap:StatementClassOfStockAxis), not in total; `member` is the class whose shares are
# listed under the symbol. The sec_xbrl source reads those values from the full filings
# (edgartools) and the build takes this class's. Checked in each latest 10-K on 2026-11-17:
# diluted EPS reported only per class.
#
# [[custom_tag]]: an item a company reports only under its own tags (not in SEC's company
# facts), summed per filing and period; read from SEC's Financial Statement Data Sets or full
# filings (raw_sec_xbrl_fact). Each one checked in the company's cash-flow statements: the
# lines listed are its whole capex and nothing else.
#
# [[formed]]: the company did not exist in its current form before `date`; its earlier history
# belongs to a different business, so the years before are not expected (coverage status
# "before_listing", with the reason). Used where the price history starts earlier, so the
# listing date alone doesn't show it.

