# The watch on the orchestrator (issue #30, docs/ORCHESTRATION.md), from outside it: Airflow
# emails its own failures, but it can't report that it isn't running (the VM is down, the DAG
# is paused). Every 3 hours this checks the run log through the web API: the last trading
# day's stock_nightly run finished ok (once it should be over), and on weekdays a stock_quotes
# run went ok in the last 2 hours. A failed check fails the workflow, and GitHub emails the
# repository owner.
name: Pipeline watch

on:
  schedule:
    - cron: "20 */3 * * *"  # every 3 hours, 20 minutes past (the quotes run at :05)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.7"
      - run: uv run --frozen --no-dev python -m stock_analysis.pipeline audit
        env:
          STOCK_API_URL: https://stock-api-bk.azurewebsites.net
          STOCK_API_KEY: ${{ secrets.STOCK_API_KEY }}
