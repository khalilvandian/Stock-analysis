# Publishes the watch list analyses (analyses/*) as a web page on GitHub Pages:
# https://khalilvandian.github.io/Stock-analysis/
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Publish analyses page

on:
  push:
    branches: [main]
    paths: ["analyses/**", "data/screener/**", "analysis/site.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python analysis/site.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
