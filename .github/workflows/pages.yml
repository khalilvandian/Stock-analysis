# Publishes the watch list analyses (analyses/*), the market screener's latest results, the
# ticker explorer and the data coverage page as a web page on GitHub Pages:
# https://khalilvandian.github.io/Stock-analysis/
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
# Everything but the PDFs and notes comes from the database through the web API (the
# recorded runs, the screener run, the coverage snapshot, the explorer's data): add the
# repository secret STOCK_API_KEY (Settings > Secrets and variables > Actions). Without it
# those pages say there is no data yet.
# No schedule of its own: Airflow starts it after each night (docs/ORCHESTRATION.md).
name: Publish analyses page

on:
  push:
    branches: [main]
    paths:
      - "analyses/**"
      - "analysis/site.py"
      - "analysis/explore.py"
      - "analysis/explorer.js"
      - "analysis/live.js"
      - "docs/pipeline.html"
      - ".github/workflows/pages.yml"
  # Rebuilt on a push, and by the Airflow DAG stock_nightly (its publish_site task, through
  # workflow_dispatch) once the night's coverage and nightly numbers are stored (issue #30).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python analysis/site.py _site
        env:
          STOCK_API_URL: https://stock-api-bk.azurewebsites.net
          STOCK_API_KEY: ${{ secrets.STOCK_API_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
