# Publishes the watch list analyses (analyses/*), the market screener's latest results, the
# ticker explorer and the data coverage page as a web page on GitHub Pages:
# https://khalilvandian.github.io/Stock-analysis/
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
# Everything but the PDFs comes from the database through the web API (the recorded runs,
# Claude's analyses, the screener run, the coverage snapshot, the explorer's data): add the
# repository secret STOCK_API_KEY (Settings > Secrets and variables > Actions). Without it
# those pages say there is no data yet.
# No schedule of its own: Airflow starts it after each night (docs/ORCHESTRATION.md).
name: Publish analyses page

on:
  push:
    branches: [main]
    paths:
      - "analysis/site.py"
      - "analysis/explore.py"
      - "analysis/explorer.js"
      - "analysis/live.js"
      - "docs/pipeline.html"
      - ".github/workflows/pages.yml"
  # Rebuilt on a push, and by the Airflow DAG stock_nightly (its publish_site task, through
  # workflow_dispatch) once the night's coverage and nightly numbers are stored (issue #30).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_again.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The PDFs: kept in a private Blob container, public on this site.
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Copy the PDFs from Blob storage
        run: |
          mkdir -p reports
          az storage blob download-batch --account-name stockreportsbk --source reports \
            --destination reports --pattern "*/*.pdf" --overwrite true --auth-mode login \
            --only-show-errors -o none
          find reports -name "*.pdf" | wc -l
      - run: python analysis/site.py _site
        env:
          STOCK_REPORTS_DIR: reports
          STOCK_API_URL: https://stock-api-bk.azurewebsites.net
          STOCK_API_KEY: ${{ secrets.STOCK_API_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # deploy-pages sometimes doesn't yet see the artifact the step above just uploaded ("No
      # artifacts named github-pages were found"; 21 and 23 Nov 2026): wait and try once more.
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - id: deploy_again
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
