# Builds the ingest job's container image (Dockerfile) and pushes it to GitHub Container
# Registry as ghcr.io/khalilvandian/stock-analysis-ingest (free for a public repository).
# The Azure Container Apps Job pulls :latest at every run, so a push to main that changes
# the code or the settings is live from the next scheduled run (docs/INGEST.md).
# One-time setup after the first push: make the package public (GitHub > Packages >
# stock-analysis-ingest > Package settings > Change visibility), so Azure can pull it
# without a password.
name: Build ingest image

on:
  push:
    branches: [main, issue-18-ingest]   # the branch only while issue #18 is tested on Azure
    paths:
      - "src/**"
      - "config/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/ingest-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ingest-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/khalilvandian/stock-analysis-ingest:latest
            ghcr.io/khalilvandian/stock-analysis-ingest:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
