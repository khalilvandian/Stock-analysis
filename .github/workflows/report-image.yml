# Builds the report job's container image (Dockerfile.report) and pushes it to GitHub Container
# Registry as ghcr.io/khalilvandian/stock-analysis-report. The Azure Container Apps Job
# stock-report pulls :latest at every run (issue #60, docs/APPLICATION.md).
# One-time setup after the first push: make the package public (GitHub > Packages >
# stock-analysis-report > Package settings > Change visibility), so Azure can pull it.
name: Build report image

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile.report"
      - ".dockerignore"
      - ".github/workflows/report-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: report-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.report
          push: true
          tags: |
            ghcr.io/khalilvandian/stock-analysis-report:latest
            ghcr.io/khalilvandian/stock-analysis-report:${{ github.sha }}
          cache-from: type=gha,scope=report
          cache-to: type=gha,mode=max,scope=report
