# Builds the Airflow image (issue #30, docs/ORCHESTRATION.md): orchestration/Dockerfile, with
# the DAGs, the plugin stock_orch and stock_analysis.pipeline copied in, pushed to GitHub
# Container Registry. The VM pulls it when deploy/airflow.ps1 runs; the UI's Container App
# uses it too. The package must be public (Packages > stock-airflow > Settings), as the
# ingest image is, so they pull it without a password.
name: Build Airflow image

on:
  push:
    branches: [main]
    paths:
      - "orchestration/**"
      - "src/stock_analysis/__init__.py"
      - "src/stock_analysis/pipeline/**"
      - "config/**"
      - ".github/workflows/airflow-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: airflow-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: orchestration/Dockerfile
          push: true
          tags: |
            ghcr.io/khalilvandian/stock-airflow:latest
            ghcr.io/khalilvandian/stock-airflow:${{ github.sha }}
          cache-from: type=gha,scope=airflow
          cache-to: type=gha,mode=max,scope=airflow
